[package]
name = "slindex"
version = "1.1.5"
edition = "2024"
description = "Pequena Pokédex com Rust + Slint que roda em Desktop, WebAssembly e Android utilizando dados da PokeAPI."
license = "MIT"
repository = "https://github.com/igorfs10/slinDex"
authors = ["Igorfs10"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "slindex_app"
path = "src/main.rs"

[dependencies]
slint = { version = "1.17.0", features = ["std","compat-1-2", "image-default-formats"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17.0", default-features = false, features = ["backend-android-activity-06"] }
rust-embed = { version = "8.11.0", default-features = false, features = ["debug-embed"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rust-embed = { version = "8.11.0", default-features = false}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"

[build-dependencies]
serde = "1.0.228"
serde_json = "1.0.150"
slint-build = "1.17.0"
winres = "0.1.12"

[package.metadata.android]
package = "com.seuapp.slindex"
apk_name = "SlinDex"
# API 26+ é um bom mínimo hoje
min_sdk_version = 26
target_sdk_version = 34
resources  = "android/res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "SlinDex"
icon  = "@mipmap/ic_launcher"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--strip-debug"]
